l_english:
##Things were meant to go the other way##
panic.1.t:0 "Things Were Meant To Go the Other Way"
panic.1.d:0 "Creditanstalt bank has gone bankrupt today. This is proof of how hopeless situation our country is in, and Germany, holding a monopoly over our economy, does not help at all. Our debts are only growing, hope for improvement disappears with every moment, and Hitler's hooligans are just waiting for the opportunity to take power in the country with our consent or without it. We need to re-examine the situation if we want to change the fate of our country."
panic.1.a:0 "I believe the situation is not developing to our advantage"

##Creditanstalt##
panic.2.t:0 "Creditanstalt Goes Bankrupt!"
panic.2.d:0 "This morning, the worsening situation has led to a solstice in Austria. Creditanstalt bank, one of the main pillars of the Austrian banking system, has gone bankrupt and, given the current situation in the country, it cannot be expected that the crisis that has begun will be halted. Over the next few days we will see what strategy the government of Kaiser Karl I will adopt in these adverse circumstances."
panic.2.a:0 "That was to be expected"

###Dilemma in the Austrian parliament##
panic.14.t:0 "Dilemma in the Austrian parliament"
panic.14.d:0 "Today, the Austrian chancellor gave a speech in parliament during which he announced the total bankruptcy of the Archduchy of Austria. He justified his decision with the central bank's inability to rescue failing banks and enterprises. The wave of crisis that is taking its toll on the economy has therefore become too powerful to control and announcing bankruptcy is the only way out of this situation. This means, among other things, that all loans the government has taken out abroad, especially in Germany, will not be repaid!"
panic.14.a:0 "Everyone is expecting Germany's reaction now"

##Facing the music##
panic.3.t:0 "Facing the Music"
panic.3.d:0 "Creditanstalt went bankrupt just three days ago, and the wave of panic which its fall unleashed in the country is taking a terrible toll. There is, however, a chance to change our fate, the Germans who control our economy had a lot of shares in the bank, as well as a significant part of the companies that go bankrupt is owned by Germans. This morning the German Chancellor sent a telegram saying that if we don't bailout their companies immediately, the financial support they will give us will end. Time to give a speech."
panic.3.a:0 "We had to do this!"

###German Response###
panic.4.t:0 "German Response"
panic.4.d:0 "Emotions in Europe are not declining, today the German Chancellor sent an ultimatum to the French government, in which he orders from the prime minister of the republic to pay next year's installment of war reparations next month. According to our experts, this shocking decision, which violates the treaty provisions between the empire and the republic, was probably motivated by the risk of the economic crisis penetrating Germany from Austria due to the bankruptcy of many German enterprises that followed the collapse of Creditanstalt bank. This would mean that the German government is desperately looking for funds."
panic.4.a:0 "Everything is now in the hands of the French"

##Betrayed##
panic.5.t:0 "Betrayed"
panic.5.d:0 "Due to the nasty play of the Austrian government, our country was faced with a big problem. Due to the fleet expansion program and projects related to MittelEuropa, our budget does not provide for any surplus, and the case has gone wrong not only because of Austria's refusal to repay loans, but mainly because many German enterprises and investments in Austria have collapsed. Many of the failing companies did not operate only in Austria, and thus with their collapse the crisis is spreading in our country. We must act quickly!"
panic.5.a:0 "The French must pay us NOW!"

##The German will not spit in our face##
panic.6.t:0 "The German Will Not Spit in Our Face"
panic.6.d:0 "The news about the bankruptcy of Austria and the crisis that was about to begin in Germany was undoubtedly very popular in France. The joy seemed endless until yesterday evening our government received an ultimatum from the German government demanding the immediate payment of next year's war reparations installments. Such a request from Berlin could, of course, meet with only one response on our part, but unfortunately, due to Prime Minister Daladier's pacifist approach, there was a debate yesterday night between top officials and members of the French generals on this topic. It came to an end only when the president invoked his authority and the support of Marshal Petain, which made it possible to reject the German ultimatum and immediately counter-attack by remilitarizing the border with Germany. This decision, although incredibly popular among both members of the meeting and the whole society, was met with strong criticism from the prime minister, who was eventually ignored."
panic.6.a:0 "This is the end of the era of shame"

##French veto##
panic.7.t:0 "French Veto"
panic.7.d:0 "The tension in Europe continues to grow, at a press conference convened today, the French prime minister announced that the ultimatum of the German government was a violation of international law. Thus, he emphasized that in view of Germany's shameful behavior, he saw no further goal in complying with the Versailles Treaty and publicly stated that just before the press conference began, the republic's armed forces were ordered to seize the demilitarized zones along the German border. He summed it up with the words "end of an era of shame"."
panic.7.a:0 "What a twist"

##We are damned!##
panic.8.t:0 "We Are Damned!"
panic.8.d:0 "The events of the last two weeks have completely changed the situation of our country ... and for worse, much worse. The economic crisis will soon come to our country for good and without the financial injection we expected, we have no possibility to stop it. It is indeed a sad day in German history."
panic.8.a:0 "Kaiser will be furious"

##Crisis takes its toll in Germany##
panic.9.t:0 "Crisis Takes its Toll in Germany"
panic.9.d:0 "A very unfortunate coincidence led to the fact that, according to our journalists in the empire, the economic crisis has already begun to settle in Germany for good. At the moment, we are already receiving information about more and more closed factories and workers out of work. In the current situation, Germany seems to be on the brink, and without the financial support they expected to get in Austria and France, the chances of stopping the escalation of the crisis are fading."
panic.9.a:0 "First Austria, then France, now Germany, who's next !?"

##On this lovely spring day...##
panic.10.t:0 "On This Lovely Spring Day"
panic.10.d:0 "The situation in Europe seems to be exacerbated, yet our native bankers and politicians seem to ignore the specter of the crisis. Everyone lives by thinking of signing the Westminster Treaty, the arms race against Germany, or recent unrest in Ireland. One can get the impression that things happening in Europe do not concern the British Empire. The press conference organized by representatives of the London Stock Exchange together with several recognizable politicians such as Winston Churchill seems to only confirm the sacred belief in the inviolability of our financial order."
panic.10.a:0 "I wonder what those who have invested their money in Europe will say?"

##Meanwhile in the United Kingdom##
panic.11.t:0 "Meanwhile in the United Kingdom"
panic.11.d:0 "Events that have taken place in the last two weeks on European markets seem to bother the investors of the London Stock Exchange. In connection to this, a press conference was called today at which, in addition to the representatives of the stock exchange, there was also a well-known politician Winston Churchill, who publicly announced that the London Stock Exchange is safe and that he personally bought shares worth 30 pounds in total today. Despite these assurances, the atmosphere of anxiety persists and everything now depends on the course of the following days."
panic.11.a:0 "Intriguing"

#Our empire went to hell!#
panic.12.t:0 "...Our Empire Went to Hell!"
panic.12.d:0 "The moment the first British munitions factory collapsed in the Ruhr area, it became clear that, despite all efforts, Great Britain was still in Europe. The panic that broke out on the London Stock Exchange will soon become a symbol of the beginning of the end of the era, which we will all remember as the Age of Imperialism. What will come after her nobody knows, today we have to save what we can to be ready ... be ready for what the future holds."
panic.12.a:0 "It was nice while it lasted"

#BLACK FRIDAY#
panic.13.t:0 "Black Friday!"
panic.13.d:0 "Entrepreneurs and investors from all over the world have spent nervously the last few days waiting for further development of events related to the economic crisis spreading throughout Europe. When the news began coming this morning about more and more British companies bankrupting in Germany, panic broke out, angry mob of investors began asking for a return of their money, stock prices began to soar down, and more and more banks began to close their doors. May 29, 1931 will be remembered as Black Friday, and the whole event will soon be remembered as Panic 1931. The crisis that began with the bankruptcy of an Austrian bank just led to the collapse of the London Stock Exchange, and soon also the Wall Street and St. Petersburg Stock Exchanges will follow."
panic.13.a:0 "The world we know is falling apart and we can no longer stop it"
panic.13.a.tt:0 "§RGAME MAY BE NOT RESPONDING FOR APPROXIMATELY ONE MINUTE WHICH DEPENDS ON YOUR SYSTEM SPECIFICATION§!\n"

#Crisis enters Danube region#
panic.15.t:0 "Crisis Enters Danube Region"
panic.15.d:0 "Despite the rather poor condition of the Habsburg empire, the bonds connecting their countries are still strong, thus making them economically dependent on each other. So everything needed is the bankruptcy of one of them in order to destrey the economic balance of the others, and the fact that Austria has just gone bankrupt, well, that's what one may call bad luck."
panic.15.a:0 "The Austrians let us down again!"

#Crisis enters MittelEuropa
panic.16.t:0 "Crisis Enters MittelEuropa"
panic.16.d:0 "Along with the sudden deterioration of the German economy, the crisis has cost the most dependent countries. It can be said that the strong links between their economies and the German economy have proved to be both a blessing and a curse."
panic.16.a:0 "How could this have happened!?"

#Crisis enters Western Europe
panic.17.t:0 "Crisis Enters Western Europe"
panic.17.d:0 "The bankruptcy of first Germany and then Great Britain caused that virtually all of the West European economic landscape sank underground. There is no country in this region that is safe from the spreading wave of despair and misery!"
panic.17.a:0 "How could the Germans and the British let this happen !?"

#Crisis enters British Empire
panic.18.t:0 "Crisis Enters British Empire"
panic.18.d:0 "The economic dependence of the countries of the British community meant that when something bad happened to the British economy, all its dependent countries also suffered. And considering the fact that Great Britain has gone bankrupt, the forecasts for our economy are not bright."
panic.18.a:0 "The empire is lost!"

#Crisis enters Russian sphere of influence!
panic.19.t:0 "Crisis Enters Russian Sphere of Influence!"
panic.19.d:0 "Due to the raging and spreading global economic crisis, recently called Panic of 1931, the entire trade exchange of Europe, then the rest of the world, has gradually collapsed. It is now clear that the Russian economy will not withstand the tensions and the Russian economic giant will soon fall over, and we will with it."
panic.19.a:0 "Who is to blame for this crisis, Russians, Germans or British?"

#Crisis enters Asia
panic.20.t:0 "Crisis Enters Asia"
panic.20.d:0 "The imperial powers of the west have recently undergone a period of exceptionally strong economic crisis, called economists 1931 Panic. And although at first everyone hoped that it would be possible to avoid such a strong crisis entering our countries, now nobody has these illusions anymore."
panic.20.a:0 "The world has gone mad!"

#Africa in depression!
panic.21.t:0 "Africa in Depression!"
panic.21.d:0 "With the bankruptcy of the European empire, the economic collapse of our region was only a matter of time."
panic.21.a:0 "This was unavoidable"

#South America has gone bancrupt!
panic.22.t:0 "South America Has Gone Bancrupt!"
panic.22.d:0 "Virtually the entire civilized world has already been affected by the 1931 Panic, it should not be strange that we too have been affected by this global economic collapse..."
panic.22.a:0 "We became even poorer, great"

#Central America is not doing so well after all!
panic.23.t:0 "Central America Is Not Doing So Well After All"
panic.23.d:0 "Thanks to the proximity of a fairly powerful and stable US economy, the Caribbean Sea area has been able to resist the 1931 Panic for quite some time. Unfortunately, it is now becoming clear that it will be impossible to avoid the crisis completely."
panic.23.a:0 "Damn it!"

#Even United States are not safe from Panic 1931!
panic.24.t:0 "Even United States Are Not Safe From Panic 1931!"
panic.24.d:0 "Today the tragic news spread all over the United States that the Wallstreet stock market was closed. The culprit is Panic 1931, which we prefer to call the Great Depression in our country, which has turned the global trade and economic cooperation system into dust. At present, more and more banks and industrial tycoons are announcing bankruptcies and dismissing their employees, all indications are that the crisis has come to our country for good."
panic.24.a:0 "Damn these imperialists!"

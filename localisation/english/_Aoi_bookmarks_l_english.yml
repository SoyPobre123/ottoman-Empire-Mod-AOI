l_english:

 CUSTOM_DIFFICULTY_GROUP_NAME:0 "Nation Buffs"
 BM_HISTORY_TITLE:0 "Brief History"
 AGE_OF_IMPERIALISM_NAME:0 "Age of Imperialism"
 AGE_OF_IMPERIALISM_DESC:0 "The year is 1931 and the age of imperialism is in the full swing. The empires of the United Kingdom, Germany and Russia are still possessing vast influences all over the world and the alliances they created, in order to compete with each other, have grasped the attention of many secondary powers. Thus the 1930’s are about to start and the outcome of said rivalisation shall decide the future of the world."
 HITTING_FAN_NAME:0 "The Hitting of the Fan"
 HITTING_FAN_DESC:0 "Yup, that's right! That umbrella collection is about to come in real handy."
 GER_AGE_OF_IMPERIALISM_DESC:0 "The German Empire is one of the three main forces in the international arena that currently competes with the Empires of Great Britain and Russia for supremacy. At the same time, Germany has one of the most powerful fleets in the world, a colonial empire extending to many regions of the world, an alliance linking countries from Scandinavia through Africa to China, and most importantly, industry and technical thought that the world can only envy them. Many challenges still await Germany, but the doctrine of blood and steel knows no obstacles that would be impossible to overcome."
 ENG_AGE_OF_IMPERIALISM_DESC:0 "As of 1931, Great Britain remains the dominant force on the planet, with direct control of 1/4 of the globe and the other 1/4 in its sphere of influence. It is therefore clear that the so-called Pax Britannica is close to being fully implemented, but not all countries in the world are eager to recognize Great Britain as the first country in the world and are ready to push it out of this position in order to be able to take it for themselves. It will therefore be up to His Majesty's Government to guide HMS Britain through the dangerous waters of the impending storm."
 FRA_AGE_OF_IMPERIALISM_DESC:0 "The French Republic has been in a political chaos for several years, the cause of which is the defeat in the Second Franco-German War. The economic instability caused by heavy war reparations and the necessity to hand over a large part of the colonial empire to Germany contributed to the re-ignition in France of the fire of revanchism and chauvinism, which took over the entire political spectrum. It remains an open question who will be the leader who will lead France to the path of war. Quo vadis France?"
 ITA_AGE_OF_IMPERIALISM_DESC:0 "The Kingdom of Italy is an aspiring world power which has in recent years managed to establish itself both in the Mediterranean and beyond. The Italian army, the air force and most importantly the navy seem to be setting world standards, but unfortunately internal problems prevent the kingdom from achieving its goals. Organized crime, social inequality, and flawed democracy seem to be tremendously damaging the kingdom, rendering it incapable of fulfilling its aspirations. It should be the King of Italy's intention to end this unfortunate fragment of history."
 JAP_AGE_OF_IMPERIALISM_DESC:0 "The Empire of Japan is an aspiring power that is undoubtedly one of the major forces in the Far East. Under the watchful eye of the emperor, militarized democracy, as their system is often called, seems to be on the way to consolidating its sphere of influence, but the Germans and Americans are standing in the way and are also eager to strengthen their position in the region. It becomes clear in this connection that brute force will have to be used one day, but when and under what circumstances it is hard to say for now. It is certain that it will not be possible without strong allies."
 SPR_AGE_OF_IMPERIALISM_DESC:0 "The war with the US, the Rif war, the Portuguese invasion and international council over Spain. That's only the list of unfortunate events that took place in Spanish recent history, and definitely that’s not the end of their sufferings... To tell the truth, in some people's opinion, Europe ends in the Pyrenees."
 MEX_AGE_OF_IMPERIALISM_DESC:0 "Mexico has been in the sphere of an endless crisis for many decades, but it was the Calles government, known as God's personal enemy, that overwhelmed the cup of bitterness and led to the outbreak of a wide-ranging civil war. this civil war between government forces and the so-called Cristeros has attracted international attention, and support for both sides seems to be pouring in from all over the world. The year 1931 seems to bring about the long-awaited resolution of the conflict."
 MCR_AGE_OF_IMPERIALISM_DESC:0 "Mexico has been in the sphere of an endless crisis for many decades, but it was the Calles government, known as God's personal enemy, that overwhelmed the cup of bitterness and led to the outbreak of a wide-ranging civil war. this civil war between government forces and the so-called Cristeros has attracted international attention, and support for both sides seems to be pouring in from all over the world. The year 1931 seems to bring about the long-awaited resolution of the conflict."
 RUS_AGE_OF_IMPERIALISM_DESC:0 "The Russian Empire of Tsar Nicholas II is a rapidly developing state, one of the main three powers in the world. Not all however is as beautiful as it would seem, the Empire’s deep-seated problems have not been solved despite all the glories and achievements of the era, and the looming shadow of the 1905 revolution is still visible in the background. Because if not for these issues 3rd Rome, as Russians like to boast about themselves, would indeed no longer have a worthy opponent in the world."
 YUG_AGE_OF_IMPERIALISM_DESC:0 "The Balkan Federation under the rule of King Alexander I seems to be one of the main forces present in the Balkans, which is constantly and effectively resisting the influence of Italy, Germany or the fallen empire of Austria. Unfortunately, the problematic way the Federation was established in, contributed to the emergence of long-term problems that led to the destabilization of the state, which led to King Alexander I taking over the reins. The 1931 is to be remembered as the year of approval of the new constitution, thus becoming a turning point in the history of this young country."
 USA_AGE_OF_IMPERIALISM_DESC:0 "While the United States remains a global industrial and political giant, it cannot be denied that its position seems to be weakening over the past few years. The reasons for this state of affairs can be seen in the actions of the empires of Great Britain and Germany, which weakened the United States in various ways by intervening in their sphere of influence, which is especially visible in the civil war in Mexico. The Monroe Doctrine is slowly dying, and a storm seems to be gathering on the horizon that will disrupt a blissful period in US history that has been called the Jazz Age."
 AUS_AGE_OF_IMPERIALISM_DESC:0 "Not so long ago, the Archduchy of Austria was the second largest European power which, in its pride, made mistakes which, unfortunately, deprived it of its superpower status. Today the Danube Federation seems to be going through rough days, and disintegration is becoming more and more possible with each passing day. In addition, there are also problems related to the malevolent influence of Germany, as well as the growing dissatisfaction of the society, which seems to be more and more ready to support the radicals who prophesy their vision of restoring the empire. Black clouds gather over Schönbrunn Palace."
 ECH_AGE_OF_IMPERIALISM_DESC:0 "The Empire of China is a country which was created in the aftermath of the very troublesome beginning of XX century. Anarchy, civil wars and foreign interventions, shaped the surroundings around the empire established by famous Chinese commander Yuan Shikai soon to be succeeded by his son, Yuan Keding. The relative peace of the decade that came after the ceasefire was announced made possible rebuilding of the area and to build public support for the Hongxian dynasty. Such conditions may soon allow the empire to step once again on the warpath, with the goal being the unification of China."
 MAN_AGE_OF_IMPERIALISM_DESC:0 "In 1918 the Chinese Civil war was at its fullest, which was used by various foreign nations to their own benefits. Such a situation of chaos and anarchy allowed the Manchurian Rebirth uprising to take place and, thanks to foreign help, secure the Manchurian part of China under control of the Qing dynasty under Puyi. Over a decade has passed since that time and just as the reignimenent of civil war seems to be approaching, the Qing Empire seems to be ready to take part in it in order to reconquer China for good."
 CHI_AGE_OF_IMPERIALISM_DESC:0 "The Republic of China is a country which was created in the aftermath of the very troublesome beginning of XX century. Anarchy, civil wars and foreign interventions, shaped the surroundings around the republic established by ideals of Dr. Sun Yat-sen. The nation itself now, after over a decade of relative peace, seems to be getting itself ready to call off the ceasefire and under leadership of president Chiang Kai-shek move forward and reunite the divided China."
 POL_AGE_OF_IMPERIALISM_DESC:0 "The Kingdom of Poland is the so-called eastern gate of Europe, which brings this state both great benefits and great risk, because being on the border of the zones of influence of Germany, Russia and even the weakened Austria makes this region extremely restless. The state is ruled by Grand Duke Andrzej Władymirowicz, who, together with Stanisław Grabski, are trying to keep Poland in the Russian sphere of influence, as well as to continue the current economic and military policy, which is to establish the western battlement of the Russian Empire. The opposition, however, remains strong."
 POR_AGE_OF_IMPERIALISM_DESC:0 "Being in the Western extreme of the European Continent the Portuguese Republic is a nation struggling with its own ambitions and woes. The past decades weren't the simplest, following the 1910 regicide and the chaotic 1st Republic, the country now finds itself ruled by the provisional government of Sidónio Pais, who promises to one day end the political tutelage of the country. The past decade however turned into a chain of failures that proved how ineffective his administration became, and just how much it turned for authoritarian ways. Eventually things shall change and new people in power will have to make things right."
 SAF_AGE_OF_IMPERIALISM_DESC:0 "Since the British-Japanese alliance and thus Commonwealth of Nations became a thing, the promoted policy of racial equality has brought many problems to South Africa. The state of unrest was however largely squashed by Jan Smuts, a talented statesman and a British loyalist. His rule which started back then saw major British sponsored investments and also many social reforms which were slowly passed. Right now South Africa remains a fairly stable nation with great possibilities at hand."
 CAN_AGE_OF_IMPERIALISM_DESC:0 "Since the British-Japanese alliance became a thing and the Commonwealth of Nations was established, the relations of said alliance with the US quickly soured. This chain of events cause much stir and fears in Canadian politics, causing it to become much more nationalistic, but also more unified in face of probable danger caused by their southern neighbour. Thus the future of Canada remains uncertain and only with the strength of its own and support of its allies, will the positive outcome be a possible one."
 AST_AGE_OF_IMPERIALISM_DESC:0 "The Dominion of Australasia was created, roughly 10 years ago, in face of increased tensions over the Pacific, with the threat of both Germany and US becoming much more evident than it was at the start of the century. The nations remained stable for its entire existence, however they tend to suffer from some... positive assumptions."
 RAJ_AGE_OF_IMPERIALISM_DESC:0 "British Raj is known for being the pearl in the crown of the British Empire. This state of things however seems to be changing with each passing year as India is gaining a bigger level of autonomy and is at the moment aspiring to become a fully fledged dominion. The Indian National Congress however seems to be demanding something greater than that  thus leaving the status quo in a dubious situation."
 AFG_AGE_OF_IMPERIALISM_DESC:0 "The Kingdom of Afghanistan is squeezed between spheres of influence of Russian and the British Empires. It is a pawn in their great game, but despite it, it remains independent for the time being. And this very independence is a source for a great plot they are hatching."
 NEP_AGE_OF_IMPERIALISM_DESC:0 "The Kingdom of Nepal is a complicated place. They are a fairly developed nation for the region, one with a great professional army and big ambitions, but also one tied down by corruption and nepotism. The source of said corruption is simple and actually has a name, Rana family."
 TIB_AGE_OF_IMPERIALISM_DESC:0 "During the days of the Chinese Civil War the Great Game between Russia and the United Kingdom continued, with the British gaining advantage over their rivals by finally managing to introduce Tibet into their zone of influence. Since then, many changes took place and Tibet grew to become a somewhat more serious nation than it was before... Sadly stability didn’t come hand in hand with progress."
 TRC_AGE_OF_IMPERIALISM_DESC:0 "The Viceroyalty of Transcaucasia is definitely an interesting place to be. Placed in what used to be the Southern part of European Russia, the viceroyalty is made of mosaic of ethnicities and religions and definitely a nation of contrasts. Days here go peacefully for now, but that may be but a mirage."
 TUR_AGE_OF_IMPERIALISM_DESC:0 "Since the last war, our nation gone to the downfall. with the loose of all we had. our asian territories, libya. yemen. iraq. syria, palestine. our empire remains on ruins. with a civil war after the loose of our territories. the city of constantino has been liberated. now our remains is anatolia. we must fix our problems if we all want to recover what was ours."
 #PRC_AGE_OF_IMPERIALISM_DESC:0 "After the death of Sun Yat-sen, there was a split in the Republic of China occupying the southern part of the former empire. The nomination of President Chiang Kai-shek was boycotted by the left wing of the Kuomintang led by Wang Jingwei, which soon rebelled and took over the western part of the republic. The People's Republic is the youngest country in China, but thanks to revolutionary thought, which has supporters in all parts of the former empire, it is the black horse of the race for dominance in the Far East."
 OTHER_AGE_OF_IMPERIALISM_DESC:0 "Recent years have brought worsening friction between the main countries of the world, causing the rise of the risk of arousing global conflict. In the face of the impending storm, no country can feel safe, but the storm, in addition to destruction, may bring a chance to establish a new world order in which sidelined nations may start playing main role, while current big players may lose their influence. Therefore, one needs to prepare, because great risks and great opportunities are just around the corner."
